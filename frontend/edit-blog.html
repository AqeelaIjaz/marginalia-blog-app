<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit post — Marginalia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="site-wrap">

    <nav class="navbar">
      <div class="navbar-inner">
        <div class="wordmark">Margin<span>alia</span></div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="create-blog.html">Write</a>
        </div>
        <div class="nav-user" id="navUser"></div>
      </div>
    </nav>

    <main class="container" style="max-width: 640px; padding-top: 56px; padding-bottom: 80px;">
      <div class="form-card">
        <div class="form-eyebrow">Editing post</div>
        <h2>Update your post.</h2>

        <div class="form-message" id="formMessage"></div>

        <form id="editBlogForm" novalidate>
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" style="width:100%; padding:12px 14px; border:1.5px solid var(--border-light); border-radius:6px; background:var(--bg-alt); color:var(--ink); font-family:var(--font-body); font-size:0.95rem;">
              <option value="General">General</option>
              <option value="Tech">Tech</option>
              <option value="Life">Life</option>
              <option value="Travel">Travel</option>
              <option value="Food">Food</option>
              <option value="Opinion">Opinion</option>
            </select>
          </div>
          <div class="field">
            <label for="content">Content</label>
            <textarea id="content" name="content" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Save changes</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>© 2026 Marginalia · Codomax Internship, Module 4</span>
        <span><a href="index.html">Home</a> · <a href="dashboard.html">Dashboard</a></span>
        <span>Built with Node.js + Express + MongoDB</span>
      </div>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
