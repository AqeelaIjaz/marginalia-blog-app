<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Marginalia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="site-wrap">

    <nav class="navbar">
      <div class="navbar-inner">
        <div class="wordmark">Margin<span>alia</span></div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="create-blog.html">Write</a>
        </div>
        <div class="nav-user" id="navUser"></div>
      </div>
    </nav>

    <main class="container" style="max-width: 460px; padding-top: 64px; padding-bottom: 80px;">
      <div class="form-card">
        <div class="form-eyebrow">Account recovery</div>
        <h2>Reset your password</h2>
        <p style="margin-top:-6px; margin-bottom:22px; font-size:0.92rem;">Enter the email on your account and we'll send you a link to choose a new password.</p>

        <div class="form-message" id="formMessage"></div>

        <form id="forgotForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>

        <p class="form-footer-note">Remembered it? <a href="login.html">Sign in</a></p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>© 2026 Marginalia · Codomax Internship, Module 2</span>
        <span><a href="index.html">Home</a> · <a href="login.html">Sign in</a></span>
        <span>Built with Node.js + Express + MongoDB</span>
      </div>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
