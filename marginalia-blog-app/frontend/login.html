<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Marginalia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="site-wrap">

    <nav class="navbar">
      <div class="navbar-inner">
        <div class="wordmark">Margin<span>alia</span></div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="create-blog.html">Write</a>
        </div>
        <div class="nav-user" id="navUser"></div>
      </div>
    </nav>

    <main class="container" style="max-width: 460px; padding-top: 64px; padding-bottom: 80px;">
      <div class="form-card">
        <div class="form-eyebrow">Welcome back</div>
        <h2>Sign in to your account</h2>

        <div class="form-message" id="formMessage"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </div>
          <div class="form-link-row">
            <span></span>
            <a href="forgot-password.html">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>

        <p class="form-footer-note">New here? <a href="register.html">Sign up</a></p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>© 2026 Marginalia · Codomax Internship, Module 2</span>
        <span><a href="index.html">Home</a> · <a href="register.html">Sign up</a></span>
        <span>Built with Node.js + Express + MongoDB</span>
      </div>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
